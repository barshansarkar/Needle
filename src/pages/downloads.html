<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Downloads — Nova</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
      background: #0a0a0f; color: #e8e8f0;
      padding: 40px; min-height: 100vh;
    }
    h1 {
      font-size: 28px; margin-bottom: 6px;
      background: linear-gradient(90deg, #7c5cff, #ff5cd0);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .sub { color: #7a7a8c; font-size: 13px; margin-bottom: 24px; }
    .item {
      padding: 16px 18px; border-radius: 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 10px; transition: border-color .2s;
    }
    .item:hover { border-color: rgba(124,92,255,0.4); }
    .row { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
    .name {
      flex: 1; font-size: 14px; font-weight: 500;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .state {
      font-size: 11px; padding: 2px 8px; border-radius: 999px;
      background: rgba(124,92,255,0.2); color: #a99cff;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .state.completed { background: rgba(92,255,158,0.15); color: #5cff9e; }
    .state.cancelled, .state.interrupted { background: rgba(255,59,92,0.15); color: #ff5c7a; }
    .bar {
      height: 6px; background: rgba(255,255,255,0.06);
      border-radius: 999px; overflow: hidden; margin-bottom: 8px;
    }
    .bar-fill {
      height: 100%; background: linear-gradient(90deg, #7c5cff, #ff5cd0);
      transition: width .3s; box-shadow: 0 0 12px rgba(124,92,255,0.5);
    }
    .meta { display: flex; justify-content: space-between; font-size: 11.5px; color: #7a7a8c; }
    .actions { display: flex; gap: 8px; margin-top: 10px; }
    .actions button {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: #e8e8f0; padding: 5px 12px; border-radius: 8px;
      font-family: inherit; font-size: 12px; cursor: pointer;
      transition: all .15s;
    }
    .actions button:hover { background: rgba(124,92,255,0.35); border-color: #7c5cff; }
    .empty { color: #7a7a8c; text-align: center; padding: 60px 0; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Downloads</h1>
  <div class="sub" id="count">Loading…</div>
  <div id="list"></div>

  <script>
    const fmtBytes = (b) => {
      if (!b) return '0 B';
      const u = ['B','KB','MB','GB'];
      let i = 0;
      while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
      return b.toFixed(i ? 1 : 0) + ' ' + u[i];
    };
    const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function render(list) {
      const el = document.getElementById('list');
      document.getElementById('count').textContent = `${list.length} item${list.length !== 1 ? 's' : ''}`;

      if (!list.length) {
        el.innerHTML = `<div class="empty">No downloads yet.</div>`;
        return;
      }

      el.innerHTML = list.map(d => {
        const pct = d.totalBytes > 0 ? Math.min(100, (d.receivedBytes / d.totalBytes) * 100) : 0;
        const size = d.totalBytes > 0
          ? `${fmtBytes(d.receivedBytes)} / ${fmtBytes(d.totalBytes)}`
          : fmtBytes(d.receivedBytes);
        return `
          <div class="item">
            <div class="row">
              <div class="name">${escapeHtml(d.filename)}</div>
              <span class="state ${d.state}">${d.state}</span>
            </div>
            <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
            <div class="meta"><span>${size}</span><span>${pct.toFixed(0)}%</span></div>
            ${d.state === 'completed' ? `
              <div class="actions">
                <button data-open="${encodeURIComponent(d.savePath || '')}">Open</button>
                <button data-show="${encodeURIComponent(d.savePath || '')}">Show in Folder</button>
              </div>` : ''}
          </div>
        `;
      }).join('');

      el.querySelectorAll('button[data-open]').forEach(b => {
        b.onclick = () => window.novaAPI?.openPath(decodeURIComponent(b.dataset.open));
      });
      el.querySelectorAll('button[data-show]').forEach(b => {
        b.onclick = () => window.novaAPI?.showItem(decodeURIComponent(b.dataset.show));
      });
    }

    if (window.novaAPI?.on) {
      window.novaAPI.on('downloads:update', (list) => render(list || []));
    }
    render([]);
  </script>
</body>
</html>
