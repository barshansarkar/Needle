<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>Downloads — NIDDLE</title>
  <style>
    /* ═══════════════ RESET & TOKENS ═══════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #09090b;
      --bg-panel:    #0e0e12;
      --bg-elev:     #14141a;
      --surface:     rgba(255, 255, 255, 0.028);
      --surface-hi:  rgba(255, 255, 255, 0.055);
      --border:      rgba(255, 255, 255, 0.06);
      --border-hi:   rgba(255, 255, 255, 0.11);
      --text:        #f4f4f5;
      --text-dim:    #a1a1aa;
      --text-muted:  #52525b;

      --accent:      #8b5cf6;
      --accent-2:    #ec4899;

      --ok:          #10b981;
      --ok-soft:     rgba(16, 185, 129, 0.14);
      --warn:        #f59e0b;
      --danger:      #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.14);

      --r-sm:  8px;
      --r:     10px;
      --r-md:  12px;
      --r-lg:  16px;

      --ease: cubic-bezier(.4, 0, .2, 1);
    }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13.5px;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      display: flex;
      height: 100vh;
    }

    body::before {
      content: '';
      position: fixed; inset: -30%;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(700px circle at 15% -10%, rgba(139, 92, 246, 0.10), transparent 55%),
        radial-gradient(800px circle at 90% 110%, rgba(236, 72, 153, 0.07), transparent 55%);
      filter: blur(18px);
    }

    svg { display: block; }
    button, input { font-family: inherit; }

    /* ═══════════════ SIDEBAR ═══════════════ */
    .sidebar {
      position: relative;
      z-index: 1;
      width: 248px;
      flex-shrink: 0;
      height: 100vh;
      padding: 26px 16px 18px;
      background: linear-gradient(180deg, #0c0c11 0%, #09090b 100%);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb {
      background: rgba(139, 92, 246, 0.3);
      border-radius: 2px;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 8px 22px;
      margin-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .brand-mark {
      position: relative;
      width: 26px; height: 26px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.10) inset,
        0 0 22px rgba(139, 92, 246, 0.5);
    }
    .brand-mark::after {
      content: '';
      position: absolute;
      inset: 2.5px;
      border-radius: 5px;
      background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.6), transparent 55%);
    }

    .brand-name {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.2em;
      color: #fafafa;
    }
    .brand-name small {
      display: block;
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .nav-group-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 16px 10px 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 9px 11px;
      border-radius: var(--r);
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all .18s var(--ease);
      user-select: none;
    }
    .nav-item svg {
      width: 15px; height: 15px;
      flex-shrink: 0;
      opacity: 0.75;
      transition: opacity .18s var(--ease), color .18s var(--ease);
    }
    .nav-item .label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .nav-item .count {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      padding: 2px 7px;
      border-radius: 5px;
      font-variant-numeric: tabular-nums;
      transition: all .18s var(--ease);
    }
    .nav-item:hover {
      background: var(--surface);
      color: var(--text);
    }
    .nav-item:hover svg { opacity: 1; }
    .nav-item.active {
      background: linear-gradient(135deg,
        rgba(139, 92, 246, 0.18) 0%,
        rgba(236, 72, 153, 0.10) 100%);
      border-color: rgba(139, 92, 246, 0.32);
      color: #ffffff;
      box-shadow: 0 0 18px rgba(139, 92, 246, 0.14);
    }
    .nav-item.active svg { opacity: 1; color: var(--accent); }
    .nav-item.active .count {
      background: rgba(139, 92, 246, 0.25);
      color: #ddd6fe;
    }

    .sidebar-foot {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.6;
      padding-left: 10px;
    }
    .sidebar-foot strong {
      color: var(--text-dim);
      font-weight: 600;
    }

    /* ═══════════════ MAIN ═══════════════ */
    .main {
      position: relative;
      z-index: 1;
      flex: 1;
      height: 100vh;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .main::-webkit-scrollbar { width: 8px; }
    .main::-webkit-scrollbar-track { background: transparent; }
    .main::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
    }
    .main::-webkit-scrollbar-thumb:hover {
      background: rgba(139, 92, 246, 0.35);
    }

    .main-inner {
      max-width: 780px;
      margin: 0 auto;
      padding: 44px 40px 80px;
    }

    /* ── Page header ── */
    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 26px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }

    .page-head h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 5px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .page-head p {
      font-size: 13px;
      color: var(--text-muted);
      max-width: 480px;
      line-height: 1.5;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .count-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid rgba(139, 92, 246, 0.22);
      color: #c4b5fd;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.01em;
      font-variant-numeric: tabular-nums;
    }
    .count-chip svg { width: 11px; height: 11px; opacity: 0.85; }

    .head-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 15px;
      border-radius: var(--r);
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      transition: all .18s var(--ease);
      white-space: nowrap;
    }
    .btn svg { width: 14px; height: 14px; }
    .btn:hover {
      background: var(--surface-hi);
      border-color: var(--border-hi);
      transform: translateY(-1px);
    }
    .btn:active { transform: translateY(0); }

    .btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
      color: #fff;
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.35);
    }
    .btn.primary:hover {
      box-shadow: 0 0 28px rgba(139, 92, 246, 0.55);
    }

    .btn.danger {
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.25);
      background: rgba(239, 68, 68, 0.06);
    }
    .btn.danger:hover {
      background: rgba(239, 68, 68, 0.14);
      border-color: rgba(239, 68, 68, 0.5);
      color: #fecaca;
      box-shadow: 0 0 18px rgba(239, 68, 68, 0.15);
    }

    .btn.ghost {
      background: transparent;
      border-color: transparent;
      color: var(--text-dim);
      padding: 7px 11px;
      font-size: 12px;
    }
    .btn.ghost:hover {
      background: var(--surface);
      color: var(--text);
    }

    /* ── Search field ── */
    .search-row {
      margin-bottom: 22px;
    }

    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .search-wrap .icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      pointer-events: none;
      transition: color .18s var(--ease);
    }
    .search-wrap .icon svg { width: 15px; height: 15px; }

    .search-wrap input {
      width: 100%;
      padding: 11px 40px 11px 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: all .18s var(--ease);
    }
    .search-wrap input::placeholder { color: var(--text-muted); }
    .search-wrap input:hover {
      background: var(--surface-hi);
      border-color: var(--border-hi);
    }
    .search-wrap input:focus {
      background: var(--bg-elev);
      border-color: rgba(139, 92, 246, 0.55);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
    }
    .search-wrap:focus-within .icon { color: var(--accent); }

    .search-wrap kbd {
      position: absolute;
      right: 14px;
      font-family: inherit;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 3px 7px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      letter-spacing: 0.02em;
      pointer-events: none;
      transition: opacity .2s var(--ease);
    }
    .search-wrap:focus-within kbd { opacity: 0; }

    /* ── Section card ── */
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 4px 22px;
      margin-bottom: 14px;
      backdrop-filter: blur(10px);
      transition: border-color .2s var(--ease);
    }
    .section:hover { border-color: var(--border-hi); }

    .section-head {
      padding: 18px 0 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-icon {
      width: 30px; height: 30px;
      border-radius: var(--r-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg,
        rgba(139, 92, 246, 0.18),
        rgba(236, 72, 153, 0.10));
      color: var(--accent);
      border: 1px solid rgba(139, 92, 246, 0.22);
      flex-shrink: 0;
    }
    .section-icon svg { width: 15px; height: 15px; }

    .section-icon.ok {
      background: linear-gradient(135deg,
        rgba(16, 185, 129, 0.18),
        rgba(132, 204, 22, 0.10));
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.28);
    }
    .section-icon.danger {
      background: linear-gradient(135deg,
        rgba(239, 68, 68, 0.18),
        rgba(249, 115, 22, 0.10));
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.28);
    }

    .section-head-text {
      flex: 1;
      min-width: 0;
    }
    .section-head-text h2 {
      font-size: 13.5px;
      font-weight: 650;
      letter-spacing: -0.005em;
      margin-bottom: 2px;
    }
    .section-head-text p {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .section-count {
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    /* ── Download entry ── */
    .entry {
      padding: 14px 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.035);
      transition: all .16s var(--ease);
      border-radius: var(--r-sm);
    }

    .entry:hover {
      padding-left: 12px;
      padding-right: 8px;
      background: linear-gradient(135deg,
        rgba(139, 92, 246, 0.08) 0%,
        rgba(236, 72, 153, 0.04) 100%);
    }

    .entry-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .file-icon {
      width: 34px;
      height: 34px;
      border-radius: var(--r-sm);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text-dim);
      transition: all .18s var(--ease);
    }
    .file-icon svg { width: 15px; height: 15px; }

    .entry:hover .file-icon {
      background: linear-gradient(135deg,
        rgba(139, 92, 246, 0.20),
        rgba(236, 72, 153, 0.12));
      border-color: rgba(139, 92, 246, 0.35);
      color: #ddd6fe;
    }

    .file-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .file-name {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 1.35;
    }

    .file-url {
      font-size: 11.5px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 1.35;
    }

    /* ── State pill ── */
    .state {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 9px;
      border-radius: 999px;
      flex-shrink: 0;
      background: rgba(139, 92, 246, 0.14);
      color: #c4b5fd;
      border: 1px solid rgba(139, 92, 246, 0.25);
    }
    .state::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 6px currentColor;
    }
    .state.progressing::before {
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.35; }
    }

    .state.completed {
      background: var(--ok-soft);
      color: #6ee7b7;
      border-color: rgba(16, 185, 129, 0.28);
    }
    .state.cancelled,
    .state.interrupted {
      background: var(--danger-soft);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.28);
    }

    /* ── Progress bar ── */
    .bar {
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 9px;
      border: 1px solid var(--border);
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width .35s var(--ease);
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.55);
    }
    .bar-fill.completed {
      background: linear-gradient(90deg, #10b981, #84cc16);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
    }
    .bar-fill.cancelled,
    .bar-fill.interrupted {
      background: linear-gradient(90deg, #ef4444, #f97316);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
    }

    /* ── Meta row ── */
    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .meta-size {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .meta-pct {
      padding: 2px 7px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      font-weight: 600;
      color: var(--text-dim);
    }

    /* ── Actions ── */
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    /* ── Empty states ── */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 70px 20px;
      text-align: center;
    }

    .empty-icon {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg,
        rgba(139, 92, 246, 0.14),
        rgba(236, 72, 153, 0.08));
      border: 1px solid rgba(139, 92, 246, 0.22);
      color: var(--accent);
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.15);
    }
    .empty-icon svg { width: 26px; height: 26px; }

    .empty-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }
    .empty-desc {
      font-size: 12.5px;
      color: var(--text-muted);
      max-width: 340px;
      line-height: 1.55;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 11px 16px 11px 14px;
      background: rgba(20, 20, 26, 0.95);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-radius: var(--r-md);
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text);
      box-shadow:
        0 16px 48px rgba(0, 0, 0, 0.7),
        0 0 34px rgba(139, 92, 246, 0.22);
      opacity: 0;
      pointer-events: none;
      transition: all .32s var(--ease);
      z-index: 1000;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-icon {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.5);
    }
    .toast-icon svg { width: 11px; height: 11px; color: #fff; stroke-width: 3; }

    .toast.danger { border-color: rgba(239, 68, 68, 0.4); }
    .toast.danger .toast-icon {
      background: linear-gradient(135deg, #ef4444, #f97316);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
    }
  </style>
</head>
<body>

  <!-- ══════════════ SIDEBAR ══════════════ -->
  <aside class="sidebar">
    <div class="brand-lockup">
      <span class="brand-mark"></span>
      <div class="brand-name">NIDDLE<small>DOWNLOADS</small></div>
    </div>

    <div class="nav-group-label">Overview</div>

    <div class="nav-item active" data-filter="all">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>
      </svg>
      <span class="label">All downloads</span>
      <span class="count" id="nav-count-all">0</span>
    </div>

    <div class="nav-item" data-filter="progressing">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7v5l3 2"/>
      </svg>
      <span class="label">In progress</span>
      <span class="count" id="nav-count-progressing">0</span>
    </div>

    <div class="nav-item" data-filter="completed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="m8.5 12.5 2.5 2.5 4.5-5"/>
      </svg>
      <span class="label">Completed</span>
      <span class="count" id="nav-count-completed">0</span>
    </div>

    <div class="nav-item" data-filter="failed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 8v5M12 16h.01"/>
      </svg>
      <span class="label">Failed</span>
      <span class="count" id="nav-count-failed">0</span>
    </div>

    <div class="sidebar-foot">
      <strong>Tip</strong><br>
      Downloads live only in memory — closing NIDDLE clears them.
    </div>
  </aside>

  <!-- ══════════════ MAIN ══════════════ -->
  <main class="main">
    <div class="main-inner">

      <div class="page-head">
        <div>
          <h1 id="pane-title">All downloads</h1>
          <p>
            <span id="pane-desc">Files you've downloaded this session</span>
            <span class="count-chip">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>
              </svg>
              <span id="count">0</span>
            </span>
          </p>
        </div>
        <div class="head-actions">
          <button class="btn danger" id="clear-completed">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
              <path d="M10 11v6M14 11v6"/>
            </svg>
            Clear completed
          </button>
        </div>
      </div>

      <div class="search-row">
        <label class="search-wrap">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"/>
              <path d="m20 20-3.5-3.5"/>
            </svg>
          </span>
          <input id="search" type="text" placeholder="Search by filename or URL…" spellcheck="false" autocomplete="off" />
          <kbd>/</kbd>
        </label>
      </div>

      <div id="list"></div>
    </div>
  </main>

  <!-- ══════════════ TOAST ══════════════ -->
  <div class="toast" id="toast">
    <span class="toast-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="m5 12 5 5L20 7"/>
      </svg>
    </span>
    <span id="toast-text">Done</span>
  </div>

  <script>
    // ═══════════════ ICONS ═══════════════
    const ICONS = {
      file: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3v5h5"/>
          <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        </svg>`,

      archive: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="4" rx="1"/>
          <path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/>
          <path d="M10 12h4"/>
        </svg>`,

      image: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2.5"/>
          <circle cx="9" cy="9" r="1.6"/>
          <path d="m21 15-5-5L5 21"/>
        </svg>`,

      video: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="m22 8-6 4 6 4V8z"/>
          <rect x="2" y="6" width="14" height="12" rx="2"/>
        </svg>`,

      audio: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>`,

      code: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="m8 8-4 4 4 4"/>
          <path d="m16 8 4 4-4 4"/>
          <path d="m14 4-4 16"/>
        </svg>`,

      pdf: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3v5h5"/>
          <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <path d="M9 13h1.5a1.5 1.5 0 1 1 0 3H9v-3zm0 0v5"/>
        </svg>`,

      completed: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="m8.5 12.5 2.5 2.5 4.5-5"/>
        </svg>`,

      progressing: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 2"/>
        </svg>`,

      failed: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 8v5M12 16h.01"/>
        </svg>`,

      folder: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.5L11 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z"/>
        </svg>`,

      external: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h6v6"/>
          <path d="M10 14 21 3"/>
          <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/>
        </svg>`,

      empty: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"/>
          <path d="m7 10 5 5 5-5"/>
          <path d="M5 21h14"/>
        </svg>`,

      searchEmpty: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <path d="m20 20-3.5-3.5"/>
        </svg>`,
    };

    // ═══════════════ STATE ═══════════════
    let all = [];
    let activeFilter = 'all';

    const API = window.novaAPI || window.browserAPI;

    // ═══════════════ HELPERS ═══════════════
    const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));

    function fmtBytes(b) {
      if (!b) return '0 B';
      const u = ['B', 'KB', 'MB', 'GB', 'TB'];
      let i = 0;
      while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
      return b.toFixed(i ? 1 : 0) + ' ' + u[i];
    }

    function pickFileIcon(filename = '') {
      const ext = (filename.split('.').pop() || '').toLowerCase();
      if (['zip', 'rar', '7z', 'tar', 'gz', 'bz2'].includes(ext))          return ICONS.archive;
      if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'avif', 'bmp'].includes(ext)) return ICONS.image;
      if (['mp4', 'mkv', 'mov', 'webm', 'avi', 'flv', 'm4v'].includes(ext)) return ICONS.video;
      if (['mp3', 'wav', 'flac', 'ogg', 'm4a', 'aac'].includes(ext))        return ICONS.audio;
      if (['js', 'ts', 'jsx', 'tsx', 'json', 'html', 'css', 'py', 'go', 'rs', 'java', 'sh'].includes(ext)) return ICONS.code;
      if (ext === 'pdf')                                                     return ICONS.pdf;
      return ICONS.file;
    }

    function stateCategory(state) {
      if (state === 'completed') return 'completed';
      if (state === 'cancelled' || state === 'interrupted') return 'failed';
      return 'progressing';
    }

    function stateLabel(state) {
      if (state === 'completed')  return 'Completed';
      if (state === 'cancelled')  return 'Cancelled';
      if (state === 'interrupted') return 'Interrupted';
      return 'Downloading';
    }

    // ═══════════════ TOAST ═══════════════
    const toastEl = document.getElementById('toast');
    const toastText = document.getElementById('toast-text');
    let toastTimer = null;

    function showToast(msg = 'Done', variant = 'ok') {
      toastText.textContent = msg;
      toastEl.classList.toggle('danger', variant === 'danger');
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
    }

    // ═══════════════ SIDEBAR COUNTS ═══════════════
    function updateSidebarCounts() {
      const counts = { all: all.length, progressing: 0, completed: 0, failed: 0 };
      for (const d of all) counts[stateCategory(d.state)]++;
      document.getElementById('nav-count-all').textContent = counts.all;
      document.getElementById('nav-count-progressing').textContent = counts.progressing;
      document.getElementById('nav-count-completed').textContent = counts.completed;
      document.getElementById('nav-count-failed').textContent = counts.failed;
    }

    function updateNavActive() {
      document.querySelectorAll('.nav-item[data-filter]').forEach(el => {
        el.classList.toggle('active', el.dataset.filter === activeFilter);
      });
    }

    function updateHeader() {
      const titleEl = document.getElementById('pane-title');
      const descEl = document.getElementById('pane-desc');

      const map = {
        all:         ['All downloads',  "Files you've downloaded this session"],
        progressing: ['In progress',    'Downloads that are still running'],
        completed:   ['Completed',      'Downloads that finished successfully'],
        failed:      ['Failed',         'Cancelled or interrupted downloads'],
      };
      const [t, d] = map[activeFilter] || map.all;
      titleEl.textContent = t;
      descEl.textContent = d;
    }

    // ═══════════════ RENDER ═══════════════
    function render(filter = '') {
      const f = filter.trim().toLowerCase();

      // Filter by search + active category
      let items = all.filter(d =>
        !f ||
        (d.filename || '').toLowerCase().includes(f) ||
        (d.url || '').toLowerCase().includes(f)
      );

      if (activeFilter !== 'all') {
        items = items.filter(d => stateCategory(d.state) === activeFilter);
      }

      // Header count
      document.getElementById('count').textContent = f
        ? `${items.length} / ${all.length}`
        : String(items.length);

      const list = document.getElementById('list');

      // ── Empty states ──
      if (!items.length) {
        if (all.length === 0) {
          list.innerHTML = `
            <div class="empty">
              <div class="empty-icon">${ICONS.empty}</div>
              <div class="empty-title">No downloads yet</div>
              <div class="empty-desc">Files you download will appear here. Download history is kept only for this session.</div>
            </div>`;
        } else {
          list.innerHTML = `
            <div class="empty">
              <div class="empty-icon">${ICONS.searchEmpty}</div>
              <div class="empty-title">No matches</div>
              <div class="empty-desc">Nothing matches your search or the selected category.</div>
            </div>`;
        }
        return;
      }

      // ── Group by category ──
      const groups = { progressing: [], completed: [], failed: [] };
      for (const d of items) groups[stateCategory(d.state)].push(d);

      const sectionMeta = {
        progressing: {
          title: 'In progress',
          desc: n => `${n} download${n === 1 ? '' : 's'} running`,
          icon: ICONS.progressing,
          iconClass: '',
        },
        completed: {
          title: 'Completed',
          desc: n => `${n} file${n === 1 ? '' : 's'} finished`,
          icon: ICONS.completed,
          iconClass: 'ok',
        },
        failed: {
          title: 'Failed',
          desc: n => `${n} download${n === 1 ? '' : 's'} didn't finish`,
          icon: ICONS.failed,
          iconClass: 'danger',
        },
      };

      const sections = ['progressing', 'completed', 'failed']
        .filter(key => groups[key].length)
        .map(key => {
          const arr = groups[key];
          const meta = sectionMeta[key];
          return `
            <div class="section">
              <div class="section-head">
                <span class="section-icon ${meta.iconClass}">${meta.icon}</span>
                <div class="section-head-text">
                  <h2>${meta.title}</h2>
                  <p>${meta.desc(arr.length)}</p>
                </div>
                <span class="section-count">${arr.length}</span>
              </div>
              ${arr.map(d => renderEntry(d)).join('')}
            </div>
          `;
        }).join('');

      list.innerHTML = sections;

      // ── Wire actions ──
      list.querySelectorAll('[data-open]').forEach(b => {
        b.onclick = () => {
          const p = decodeURIComponent(b.dataset.open);
          if (p && API?.openPath) API.openPath(p);
        };
      });
      list.querySelectorAll('[data-show]').forEach(b => {
        b.onclick = () => {
          const p = decodeURIComponent(b.dataset.show);
          if (p && API?.showItem) API.showItem(p);
        };
      });
    }

    function renderEntry(d) {
      const pct = d.totalBytes > 0
        ? Math.min(100, (d.receivedBytes / d.totalBytes) * 100)
        : (d.state === 'completed' ? 100 : 0);

      const size = d.totalBytes > 0
        ? `${fmtBytes(d.receivedBytes)} / ${fmtBytes(d.totalBytes)}`
        : fmtBytes(d.receivedBytes);

      const cat = stateCategory(d.state);
      const canOpen = d.state === 'completed' && d.savePath;

      return `
        <div class="entry">
          <div class="entry-top">
            <span class="file-icon">${pickFileIcon(d.filename)}</span>
            <div class="file-info">
              <div class="file-name">${escapeHtml(d.filename)}</div>
              <div class="file-url">${escapeHtml(d.url || '')}</div>
            </div>
            <span class="state ${d.state}">${stateLabel(d.state)}</span>
          </div>

          <div class="bar">
            <div class="bar-fill ${cat === 'completed' ? 'completed' : cat === 'failed' ? 'failed' : ''}"
                 style="width:${pct}%"></div>
          </div>

          <div class="meta">
            <span class="meta-size">${size}</span>
            <span class="meta-pct">${pct.toFixed(0)}%</span>
          </div>

          ${canOpen ? `
            <div class="actions">
              <button class="btn primary" data-open="${encodeURIComponent(d.savePath)}">
                ${ICONS.external}
                Open
              </button>
              <button class="btn" data-show="${encodeURIComponent(d.savePath)}">
                ${ICONS.folder}
                Show in folder
              </button>
            </div>` : ''}
        </div>
      `;
    }

    // ═══════════════ WIRING ═══════════════
    document.getElementById('search').addEventListener('input', (e) => {
      render(e.target.value);
    });

    document.querySelectorAll('.nav-item[data-filter]').forEach(el => {
      el.addEventListener('click', () => {
        activeFilter = el.dataset.filter;
        updateNavActive();
        updateHeader();
        render(document.getElementById('search').value);
      });
    });

    document.getElementById('clear-completed').addEventListener('click', () => {
      const completedCount = all.filter(d => d.state === 'completed').length;
      if (!completedCount) {
        showToast('Nothing to clear', 'danger');
        return;
      }
      all = all.filter(d => d.state !== 'completed');
      updateSidebarCounts();
      render(document.getElementById('search').value);
      showToast(`Cleared ${completedCount} completed`);
    });

    // Keyboard: focus search with "/"
    document.addEventListener('keydown', (e) => {
      const search = document.getElementById('search');
      if (e.key === '/' && document.activeElement !== search) {
        e.preventDefault();
        search.focus();
      }
      if (e.key === 'Escape' && document.activeElement === search) {
        search.value = '';
        search.blur();
        render('');
      }
    });

    // Live sync from main process
    if (API?.on) {
      API.on('downloads:update', (list) => {
        all = Array.isArray(list) ? list : [];
        updateSidebarCounts();
        render(document.getElementById('search').value);
      });
    }

    // ═══════════════ BOOT ═══════════════
    updateNavActive();
    updateHeader();
    updateSidebarCounts();
    render();

    // Pause background animations when the tab is not visible
document.addEventListener('visibilitychange', () => {
  document.body.style.setProperty(
    'animation-play-state',
    document.hidden ? 'paused' : 'running'
  );
});
  </script>
</body>
</html>
