<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>History — NIDDLE</title>
  <style>
    /* ═══════════════ RESET & TOKENS ═══════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #09090b;
      --bg-panel:    #0e0e12;
      --bg-elev:     #14141a;
      --surface:     rgba(255, 255, 255, 0.028);
      --surface-hi:  rgba(255, 255, 255, 0.055);
      --border:      rgba(255, 255, 255, 0.06);
      --border-hi:   rgba(255, 255, 255, 0.11);
      --text:        #f4f4f5;
      --text-dim:    #a1a1aa;
      --text-muted:  #52525b;

      --accent:      #8b5cf6;
      --accent-2:    #ec4899;

      --ok:          #10b981;
      --danger:      #ef4444;

      --r-sm:  8px;
      --r:     10px;
      --r-md:  12px;
      --r-lg:  16px;

      --ease: cubic-bezier(.4, 0, .2, 1);
    }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13.5px;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      display: flex;
      height: 100vh;
    }

    body::before {
      content: '';
      position: fixed; inset: -30%;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(700px circle at 15% -10%, rgba(139, 92, 246, 0.10), transparent 55%),
        radial-gradient(800px circle at 90% 110%, rgba(236, 72, 153, 0.07), transparent 55%);
      filter: blur(18px);
    }

    svg { display: block; }
    button, input { font-family: inherit; }

    /* ═══════════════ SIDEBAR ═══════════════ */
    .sidebar {
      position: relative;
      z-index: 1;
      width: 248px;
      flex-shrink: 0;
      height: 100vh;
      padding: 26px 16px 18px;
      background: linear-gradient(180deg, #0c0c11 0%, #09090b 100%);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb {
      background: rgba(139, 92, 246, 0.3);
      border-radius: 2px;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 8px 22px;
      margin-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .brand-mark {
      position: relative;
      width: 26px; height: 26px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.10) inset,
        0 0 22px rgba(139, 92, 246, 0.5);
    }
    .brand-mark::after {
      content: '';
      position: absolute;
      inset: 2.5px;
      border-radius: 5px;
      background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.6), transparent 55%);
    }

    .brand-name {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.2em;
      color: #fafafa;
    }
    .brand-name small {
      display: block;
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .nav-group-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 16px 10px 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 9px 11px;
      border-radius: var(--r);
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all .18s var(--ease);
      user-select: none;
    }
    .nav-item svg {
      width: 15px; height: 15px;
      flex-shrink: 0;
      opacity: 0.75;
      transition: opacity .18s var(--ease), color .18s var(--ease);
    }
    .nav-item .label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .nav-item .count {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      padding: 2px 7px;
      border-radius: 5px;
      font-variant-numeric: tabular-nums;
      transition: all .18s var(--ease);
    }
    .nav-item:hover {
      background: var(--surface);
      color: var(--text);
    }
    .nav-item:hover svg { opacity: 1; }
    .nav-item.active {
      background: linear-gradient(135deg,
        rgba(139, 92, 246, 0.18) 0%,
        rgba(236, 72, 153, 0.10) 100%);
      border-color: rgba(139, 92, 246, 0.32);
      color: #ffffff;
      box-shadow: 0 0 18px rgba(139, 92, 246, 0.14);
    }
    .nav-item.active svg { opacity: 1; color: var(--accent); }
    .nav-item.active .count {
      background: rgba(139, 92, 246, 0.25);
      color: #ddd6fe;
    }

    .sidebar-foot {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.6;
      padding-left: 10px;
    }
    .sidebar-foot strong {
      color: var(--text-dim);
      font-weight: 600;
    }

    /* ═══════════════ MAIN ═══════════════ */
    .main {
      position: relative;
      z-index: 1;
      flex: 1;
      height: 100vh;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .main::-webkit-scrollbar { width: 8px; }
    .main::-webkit-scrollbar-track { background: transparent; }
    .main::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
    }
    .main::-webkit-scrollbar-thumb:hover {
      background: rgba(139, 92, 246, 0.35);
    }

    .main-inner {
      max-width: 780px;
      margin: 0 auto;
      padding: 44px 40px 80px;
    }

    /* ── Page header ── */
    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 26px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }

    .page-head h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 5px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .page-head p {
      font-size: 13px;
      color: var(--text-muted);
      max-width: 480px;
      line-height: 1.5;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .count-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid rgba(139, 92, 246, 0.22);
      color: #c4b5fd;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.01em;
      font-variant-numeric: tabular-nums;
    }
    .count-chip svg { width: 11px; height: 11px; opacity: 0.85; }

    .head-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 15px;
      border-radius: var(--r);
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      transition: all .18s var(--ease);
      white-space: nowrap;
    }
    .btn svg { width: 14px; height: 14px; }
    .btn:hover {
      background: var(--surface-hi);
      border-color: var(--border-hi);
      transform: translateY(-1px);
    }
    .btn:active { transform: translateY(0); }

    .btn.danger {
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.25);
      background: rgba(239, 68, 68, 0.06);
    }
    .btn.danger:hover {
      background: rgba(239, 68, 68, 0.14);
      border-color: rgba(239, 68, 68, 0.5);
      color: #fecaca;
      box-shadow: 0 0 18px rgba(239, 68, 68, 0.15);
    }

    .btn.ghost {
      background: transparent;
      border-color: transparent;
      color: var(--text-dim);
    }
    .btn.ghost:hover {
      background: var(--surface);
      color: var(--text);
    }

    /* ── Search field ── */
    .search-row {
      margin-bottom: 22px;
    }

    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .search-wrap .icon {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      pointer-events: none;
      transition: color .18s var(--ease);
    }
    .search-wrap .icon svg { width: 15px; height: 15px; }

    .search-wrap input {
      width: 100%;
      padding: 11px 40px 11px 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: all .18s var(--ease);
    }
    .search-wrap input::placeholder { color: var(--text-muted); }
    .search-wrap input:hover {
      background: var(--surface-hi);
      border-color: var(--border-hi);
    }
    .search-wrap input:focus {
      background: var(--bg-elev);
      border-color: rgba(139, 92, 246, 0.55);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
    }
    .search-wrap:focus-within .icon { color: var(--accent); }

    .search-wrap kbd {
      position: absolute;
      right: 14px;
      font-family: inherit;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 3px 7px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      letter-spacing: 0.02em;
      pointer-events: none;
      transition: opacity .2s var(--ease);
    }
    .search-wrap:focus-within kbd { opacity: 0; }

    /* ── Section card (day group) ── */
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 4px 22px;
      margin-bottom: 14px;
      backdrop-filter: blur(10px);
      transition: border-color .2s var(--ease);
    }
    .section:hover { border-color: var(--border-hi); }

    .section-head {
      padding: 18px 0 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-icon {
      width: 30px; height: 30px;
      border-radius: var(--r-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg,
        rgba(139, 92, 246, 0.18),
        rgba(236, 72, 153, 0.10));
      color: var(--accent);
      border: 1px solid rgba(139, 92, 246, 0.22);
      flex-shrink: 0;
    }
    .section-icon svg { width: 15px; height: 15px; }

    .section-head-text {
      flex: 1;
      min-width: 0;
    }
    .section-head-text h2 {
      font-size: 13.5px;
      font-weight: 650;
      letter-spacing: -0.005em;
      margin-bottom: 2px;
    }
    .section-head-text p {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .section-count {
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    /* ── History entry row ── */
    .entry {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 12px 4px 12px 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.035);
      cursor: pointer;
      border-radius: var(--r-sm);
      transition: all .16s var(--ease);
      position: relative;
    }

    .entry:hover {
      padding-left: 12px;
      padding-right: 8px;
      background: linear-gradient(135deg,
        rgba(139, 92, 246, 0.10) 0%,
        rgba(236, 72, 153, 0.05) 100%);
    }

    .fav {
      width: 30px;
      height: 30px;
      border-radius: var(--r-sm);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text-dim);
      transition: all .18s var(--ease);
    }
    .fav svg { width: 13px; height: 13px; }

    .entry:hover .fav {
      background: linear-gradient(135deg,
        rgba(139, 92, 246, 0.20),
        rgba(236, 72, 153, 0.12));
      border-color: rgba(139, 92, 246, 0.35);
      color: #ddd6fe;
    }

    .info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .title {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 1.35;
    }

    .url {
      font-size: 11.5px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 1.35;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .time {
      font-size: 11px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid transparent;
      transition: all .16s var(--ease);
    }
    .entry:hover .time {
      border-color: var(--border);
      color: var(--text-dim);
    }

    .del {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: all .16s var(--ease);
      flex-shrink: 0;
    }
    .del svg { width: 12px; height: 12px; }

    .entry:hover .del { opacity: 0.65; }

    .del:hover {
      opacity: 1 !important;
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      transform: scale(1.05);
    }

    /* ── Empty states ── */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 70px 20px;
      text-align: center;
    }

    .empty-icon {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg,
        rgba(139, 92, 246, 0.14),
        rgba(236, 72, 153, 0.08));
      border: 1px solid rgba(139, 92, 246, 0.22);
      color: var(--accent);
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.15);
    }
    .empty-icon svg { width: 26px; height: 26px; }

    .empty-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }
    .empty-desc {
      font-size: 12.5px;
      color: var(--text-muted);
      max-width: 340px;
      line-height: 1.55;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 11px 16px 11px 14px;
      background: rgba(20, 20, 26, 0.95);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-radius: var(--r-md);
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text);
      box-shadow:
        0 16px 48px rgba(0, 0, 0, 0.7),
        0 0 34px rgba(139, 92, 246, 0.22);
      opacity: 0;
      pointer-events: none;
      transition: all .32s var(--ease);
      z-index: 1000;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-icon {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.5);
    }
    .toast-icon svg { width: 11px; height: 11px; color: #fff; stroke-width: 3; }

    .toast.danger { border-color: rgba(239, 68, 68, 0.4); }
    .toast.danger .toast-icon {
      background: linear-gradient(135deg, #ef4444, #f97316);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
    }

    /* ── Confirm dialog ── */
    .dialog-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      z-index: 900;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s var(--ease);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .dialog-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }

    .dialog {
      background: var(--bg-elev);
      border: 1px solid var(--border-hi);
      border-radius: var(--r-lg);
      padding: 24px;
      max-width: 420px;
      width: 100%;
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.8),
        0 0 60px rgba(139, 92, 246, 0.15);
      transform: scale(0.96) translateY(8px);
      transition: transform .22s var(--ease);
    }
    .dialog-backdrop.show .dialog {
      transform: scale(1) translateY(0);
    }

    .dialog-icon {
      width: 40px; height: 40px;
      border-radius: var(--r-md);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(239, 68, 68, 0.12);
      color: #fca5a5;
      margin-bottom: 14px;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }
    .dialog-icon svg { width: 18px; height: 18px; }

    .dialog h3 {
      font-size: 15px;
      font-weight: 650;
      margin-bottom: 6px;
    }
    .dialog p {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.55;
      margin-bottom: 20px;
    }

    .dialog-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
  </style>
</head>
<body>

  <!-- ══════════════ SIDEBAR ══════════════ -->
  <aside class="sidebar">
    <div class="brand-lockup">
      <span class="brand-mark"></span>
      <div class="brand-name">NIDDLE<small>HISTORY</small></div>
    </div>

    <div class="nav-group-label">Overview</div>

    <div class="nav-item active" data-day="__all__">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/>
        <path d="M3 3v5h5"/>
        <path d="M12 7.5V12l3 2"/>
      </svg>
      <span class="label">All history</span>
      <span class="count" id="nav-count-all">0</span>
    </div>

    <div class="nav-group-label">Days</div>

    <div id="nav-days"></div>

    <div class="sidebar-foot">
      <strong>Tip</strong><br>
      Press <kbd style="font-family:inherit;padding:1px 5px;border-radius:4px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);font-size:10px;">/</kbd> to search
    </div>
  </aside>

  <!-- ══════════════ MAIN ══════════════ -->
  <main class="main">
    <div class="main-inner">

      <div class="page-head">
        <div>
          <h1 id="pane-title">All history</h1>
          <p>
            <span id="pane-desc">Every page you've visited, sorted by day</span>
            <span class="count-chip">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/>
                <path d="M3 3v5h5"/>
                <path d="M12 7.5V12l3 2"/>
              </svg>
              <span id="count">0</span>
            </span>
          </p>
        </div>
        <div class="head-actions">
          <button class="btn danger" id="clear">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
              <path d="M10 11v6M14 11v6"/>
            </svg>
            Clear all
          </button>
        </div>
      </div>

      <div class="search-row">
        <label class="search-wrap">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"/>
              <path d="m20 20-3.5-3.5"/>
            </svg>
          </span>
          <input id="search" type="text" placeholder="Search history by title or URL…" spellcheck="false" autocomplete="off" />
          <kbd>/</kbd>
        </label>
      </div>

      <div id="list"></div>
    </div>
  </main>

  <!-- ══════════════ TOAST ══════════════ -->
  <div class="toast" id="toast">
    <span class="toast-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="m5 12 5 5L20 7"/>
      </svg>
    </span>
    <span id="toast-text">Done</span>
  </div>

  <!-- ══════════════ DIALOG ══════════════ -->
  <div class="dialog-backdrop" id="dialog-backdrop">
    <div class="dialog">
      <div class="dialog-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
          <path d="M12 9v4M12 17h.01"/>
        </svg>
      </div>
      <h3 id="dialog-title">Clear all history?</h3>
      <p id="dialog-desc">This will permanently remove every entry. This action cannot be undone.</p>
      <div class="dialog-actions">
        <button class="btn ghost" id="dialog-cancel">Cancel</button>
        <button class="btn danger" id="dialog-confirm">Clear all</button>
      </div>
    </div>
  </div>

  <script>
    // ═══════════════ ICONS ═══════════════
    const ICONS = {
      link: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
        </svg>`,

      close: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round">
          <path d="M6 6l12 12M18 6 6 18"/>
        </svg>`,

      calendar: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="5" width="17" height="16" rx="2.5"/>
          <path d="M3.5 10h17M8 3v4M16 3v4"/>
        </svg>`,

      clock: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 2"/>
        </svg>`,

      empty: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/>
          <path d="M3 3v5h5"/>
          <path d="M12 7.5V12l3 2"/>
        </svg>`,

      searchEmpty: `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <path d="m20 20-3.5-3.5"/>
        </svg>`,
    };

    // ═══════════════ STATE ═══════════════
    let all = [];
    let activeDay = '__all__';

    const API = window.novaAPI || window.browserAPI;

    // ═══════════════ HELPERS ═══════════════
    const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));

    const fmtTime = (ts) => new Date(ts).toLocaleTimeString([], {
      hour: '2-digit',
      minute: '2-digit',
    });

    function groupKey(ts) {
      const d = new Date(ts);
      const now = new Date();
      if (d.toDateString() === now.toDateString()) return 'Today';
      const y = new Date(now);
      y.setDate(now.getDate() - 1);
      if (d.toDateString() === y.toDateString()) return 'Yesterday';
      return d.toLocaleDateString(undefined, {
        weekday: 'long',
        month: 'long',
        day: 'numeric',
      });
    }

    function dayLabel(ts) {
      const d = new Date(ts);
      const now = new Date();
      if (d.toDateString() === now.toDateString()) return 'Today';
      const y = new Date(now);
      y.setDate(now.getDate() - 1);
      if (d.toDateString() === y.toDateString()) return 'Yesterday';
      return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    }

    // ═══════════════ TOAST ═══════════════
    const toastEl = document.getElementById('toast');
    const toastText = document.getElementById('toast-text');
    let toastTimer = null;

    function showToast(msg = 'Done', variant = 'ok') {
      toastText.textContent = msg;
      toastEl.classList.toggle('danger', variant === 'danger');
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
    }

    // ═══════════════ DIALOG ═══════════════
    const dlgBackdrop = document.getElementById('dialog-backdrop');
    const dlgTitle    = document.getElementById('dialog-title');
    const dlgDesc     = document.getElementById('dialog-desc');
    const dlgCancel   = document.getElementById('dialog-cancel');
    const dlgConfirm  = document.getElementById('dialog-confirm');

    function confirmDialog({ title, desc, confirmLabel = 'Confirm' }) {
      return new Promise((resolve) => {
        dlgTitle.textContent = title;
        dlgDesc.textContent = desc;
        dlgConfirm.textContent = confirmLabel;
        dlgBackdrop.classList.add('show');

        const cleanup = () => {
          dlgBackdrop.classList.remove('show');
          dlgCancel.removeEventListener('click', onCancel);
          dlgConfirm.removeEventListener('click', onConfirm);
          dlgBackdrop.removeEventListener('click', onBackdrop);
        };
        const onCancel = () => { cleanup(); resolve(false); };
        const onConfirm = () => { cleanup(); resolve(true); };
        const onBackdrop = (e) => {
          if (e.target === dlgBackdrop) onCancel();
        };

        dlgCancel.addEventListener('click', onCancel);
        dlgConfirm.addEventListener('click', onConfirm);
        dlgBackdrop.addEventListener('click', onBackdrop);
      });
    }

    // ═══════════════ SIDEBAR DAYS ═══════════════
    function buildDaysNav() {
      const nav = document.getElementById('nav-days');
      const counts = new Map();
      for (const h of all) {
        const k = groupKey(h.visitedAt);
        counts.set(k, (counts.get(k) || 0) + 1);
      }

      const entries = [...counts.entries()];
      if (!entries.length) {
        nav.innerHTML = `
          <div style="padding:10px 12px;font-size:11.5px;color:var(--text-muted);">
            No days yet
          </div>`;
        return;
      }

      nav.innerHTML = entries.map(([day, count]) => `
        <div class="nav-item${activeDay === day ? ' active' : ''}" data-day="${escapeHtml(day)}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.5" y="5" width="17" height="16" rx="2.5"/>
            <path d="M3.5 10h17M8 3v4M16 3v4"/>
          </svg>
          <span class="label">${escapeHtml(day)}</span>
          <span class="count">${count}</span>
        </div>
      `).join('');

      nav.querySelectorAll('.nav-item').forEach(el => {
        el.addEventListener('click', () => {
          activeDay = el.dataset.day;
          updateNavActive();
          updateHeader();
          render(document.getElementById('search').value);
        });
      });
    }

    function updateNavActive() {
      document.querySelectorAll('.nav-item[data-day]').forEach(el => {
        el.classList.toggle('active', el.dataset.day === activeDay);
      });
    }

    function updateHeader() {
      const titleEl = document.getElementById('pane-title');
      const descEl = document.getElementById('pane-desc');

      if (activeDay === '__all__') {
        titleEl.textContent = 'All history';
        descEl.textContent = 'Every page you\'ve visited, sorted by day';
      } else {
        titleEl.textContent = activeDay;
        descEl.textContent = 'Pages visited on this day';
      }
    }

    // ═══════════════ RENDER ═══════════════
    function render(filter = '') {
      const f = filter.trim().toLowerCase();

      // Filter by search + activeDay
      let items = all.filter(h =>
        !f ||
        (h.title || '').toLowerCase().includes(f) ||
        (h.url || '').toLowerCase().includes(f)
      );

      if (activeDay !== '__all__') {
        items = items.filter(h => groupKey(h.visitedAt) === activeDay);
      }

      // Counts
      document.getElementById('count').textContent = f
        ? `${items.length} / ${all.length}`
        : String(items.length);

      document.getElementById('nav-count-all').textContent = String(all.length);

      const list = document.getElementById('list');

      // ── Empty states ──
      if (!items.length) {
        if (all.length === 0) {
          list.innerHTML = `
            <div class="empty">
              <div class="empty-icon">${ICONS.empty}</div>
              <div class="empty-title">No history yet</div>
              <div class="empty-desc">Pages you visit will appear here automatically, sorted by day.</div>
            </div>`;
        } else {
          list.innerHTML = `
            <div class="empty">
              <div class="empty-icon">${ICONS.searchEmpty}</div>
              <div class="empty-title">No matches</div>
              <div class="empty-desc">Nothing matches your search or the selected day.</div>
            </div>`;
        }
        return;
      }

      // ── Group by day ──
      const groups = {};
      for (const h of items) {
        const k = groupKey(h.visitedAt);
        (groups[k] = groups[k] || []).push(h);
      }

      // ── Section cards ──
      list.innerHTML = Object.entries(groups).map(([day, arr]) => `
        <div class="section">
          <div class="section-head">
            <span class="section-icon">${ICONS.calendar}</span>
            <div class="section-head-text">
              <h2>${escapeHtml(day)}</h2>
              <p>${arr.length} ${arr.length === 1 ? 'page' : 'pages'} visited</p>
            </div>
            <span class="section-count">${arr.length}</span>
          </div>

          ${arr.map(h => `
            <div class="entry" data-url="${encodeURIComponent(h.url)}" data-id="${h.id}">
              <span class="fav">${ICONS.link}</span>
              <div class="info">
                <div class="title">${escapeHtml(h.title || h.url)}</div>
                <div class="url">${escapeHtml(h.url)}</div>
              </div>
              <div class="meta">
                <span class="time">${fmtTime(h.visitedAt)}</span>
                <button class="del" title="Remove from history" aria-label="Remove">${ICONS.close}</button>
              </div>
            </div>
          `).join('')}
        </div>
      `).join('');

      // ── Wire interactions ──
      list.querySelectorAll('.entry').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.closest('.del')) return;
          const url = decodeURIComponent(el.dataset.url);
          window.parent?.postMessage({ type: 'nova-navigate', url }, '*');
        });

        el.querySelector('.del').addEventListener('click', async (e) => {
          e.stopPropagation();
          const id = Number(el.dataset.id);
          try {
            if (API?.historyDelete) await API.historyDelete(id);
          } catch (err) {
            console.error('delete failed', err);
          }
          all = all.filter(h => h.id !== id);
          buildDaysNav();
          updateNavActive();
          render(document.getElementById('search').value);
          showToast('Entry removed');
        });
      });
    }

    // ═══════════════ WIRING ═══════════════
    document.getElementById('search').addEventListener('input', (e) => {
      render(e.target.value);
    });

    document.getElementById('clear').addEventListener('click', async () => {
      if (!all.length) return;
      const ok = await confirmDialog({
        title: 'Clear all history?',
        desc: `This will permanently remove all ${all.length} entries. This action cannot be undone.`,
        confirmLabel: 'Clear all',
      });
      if (!ok) return;

      try {
        if (API?.historyClear) await API.historyClear();
      } catch (err) {
        console.error('clear failed', err);
      }

      all = [];
      activeDay = '__all__';
      buildDaysNav();
      updateNavActive();
      updateHeader();
      render(document.getElementById('search').value);
      showToast('History cleared', 'danger');
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      const search = document.getElementById('search');
      if (e.key === '/' && document.activeElement !== search) {
        e.preventDefault();
        search.focus();
      }
      if (e.key === 'Escape' && document.activeElement === search) {
        search.value = '';
        search.blur();
        render('');
      }
    });

    // Live sync from main process
    if (API?.on) {
      API.on('history:update', (list) => {
        all = Array.isArray(list) ? list : [];
        buildDaysNav();
        updateNavActive();
        render(document.getElementById('search').value);
      });
    }

    // ═══════════════ BOOT ═══════════════
    (async () => {
      try {
        if (API?.historyList) {
          all = (await API.historyList()) || [];
        }
      } catch (err) {
        console.error('failed to load history', err);
        all = [];
      }
      buildDaysNav();
      updateHeader();
      render();
    })();
  </script>
</body>
</html>
