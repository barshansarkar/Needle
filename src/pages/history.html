<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>History — Nova</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
      background: #0a0a0f; color: #e8e8f0;
      padding: 40px; min-height: 100vh;
    }
    h1 {
      font-size: 28px; margin-bottom: 6px;
      background: linear-gradient(90deg, #7c5cff, #ff5cd0);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .sub { color: #7a7a8c; font-size: 13px; margin-bottom: 24px; }
    .controls { display: flex; gap: 10px; margin-bottom: 20px; }
    .controls button, .controls input {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: #e8e8f0; padding: 8px 14px; border-radius: 10px;
      font-family: inherit; font-size: 13px; outline: none;
    }
    .controls input { flex: 1; }
    .controls input:focus { border-color: #7c5cff; box-shadow: 0 0 0 3px rgba(124,92,255,0.15); }
    .controls button { cursor: pointer; transition: all .2s; }
    .controls button:hover { background: rgba(124,92,255,0.3); }
    .controls button.danger:hover { background: #ff3b5c; }
    .group { margin-bottom: 24px; }
    .group-title {
      font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
      color: #7a7a8c; margin-bottom: 10px; padding-left: 4px;
    }
    .item {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 16px; border-radius: 10px;
      transition: background .15s; cursor: pointer;
    }
    .item:hover { background: rgba(124,92,255,0.1); }
    .item .fav { font-size: 16px; }
    .item .info { flex: 1; min-width: 0; }
    .item .title {
      font-size: 13.5px; margin-bottom: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .item .url {
      font-size: 11.5px; color: #7a7a8c;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .item .time { font-size: 11px; color: #7a7a8c; margin-left: 10px; }
    .item .del {
      opacity: 0; background: transparent; border: none; color: #7a7a8c;
      cursor: pointer; font-size: 14px; padding: 4px 8px; border-radius: 6px;
      transition: all .15s;
    }
    .item:hover .del { opacity: 1; }
    .item .del:hover { color: #ff3b5c; background: rgba(255,59,92,0.15); }
    .empty { color: #7a7a8c; text-align: center; padding: 60px 0; font-size: 14px; }
  </style>
</head>
<body>
  <h1>History</h1>
  <div class="sub" id="count">Loading…</div>
  <div class="controls">
    <input id="search" type="text" placeholder="Search history…" />
    <button id="clear" class="danger">Clear All</button>
  </div>
  <div id="list"></div>

  <script>
    let all = [];

    const fmtTime = (ts) => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const groupKey = (ts) => {
      const d = new Date(ts), now = new Date();
      if (d.toDateString() === now.toDateString()) return 'Today';
      const y = new Date(now); y.setDate(now.getDate() - 1);
      if (d.toDateString() === y.toDateString()) return 'Yesterday';
      return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    };

    const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function render(filter = '') {
      const f = filter.trim().toLowerCase();
      const items = all.filter(h => !f || (h.title||'').toLowerCase().includes(f) || (h.url||'').toLowerCase().includes(f));
      document.getElementById('count').textContent = `${items.length} of ${all.length} entries`;
      const list = document.getElementById('list');

      if (!items.length) {
        list.innerHTML = `<div class="empty">${all.length ? 'No matches.' : 'No history yet.'}</div>`;
        return;
      }

      const groups = {};
      for (const h of items) {
        const k = groupKey(h.visitedAt);
        (groups[k] = groups[k] || []).push(h);
      }

      list.innerHTML = Object.entries(groups).map(([day, arr]) => `
        <div class="group">
          <div class="group-title">${day}</div>
          ${arr.map(h => `
            <div class="item" data-url="${encodeURIComponent(h.url)}" data-id="${h.id}">
              <span class="fav">🔗</span>
              <div class="info">
                <div class="title">${escapeHtml(h.title || h.url)}</div>
                <div class="url">${escapeHtml(h.url)}</div>
              </div>
              <span class="time">${fmtTime(h.visitedAt)}</span>
              <button class="del" title="Remove">✕</button>
            </div>
          `).join('')}
        </div>
      `).join('');

      list.querySelectorAll('.item').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.classList.contains('del')) return;
          const url = decodeURIComponent(el.dataset.url);
          window.parent?.postMessage({ type: 'nova-navigate', url }, '*');
        });
        el.querySelector('.del').addEventListener('click', async (e) => {
          e.stopPropagation();
          const id = Number(el.dataset.id);
          if (window.novaAPI) await window.novaAPI.historyDelete(id);
          all = all.filter(h => h.id !== id);
          render(document.getElementById('search').value);
        });
      });
    }

    document.getElementById('search').addEventListener('input', (e) => render(e.target.value));
    document.getElementById('clear').addEventListener('click', async () => {
      if (!confirm('Clear all history?')) return;
      if (window.novaAPI) await window.novaAPI.historyClear();
      all = [];
      render();
    });

    (async () => {
      if (window.novaAPI) all = await window.novaAPI.historyList() || [];
      render();
    })();
  </script>
</body>
</html>
