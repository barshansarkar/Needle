<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://duckduckgo.com https://suggestqueries.google.com; font-src 'self';" />
  <title>NIDDLE Browser</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══════════ TOP BAR · brand + tabs + window controls ═══════════ -->
  <header class="chrome-top">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-text">NIDDLE</span>
      <span id="private-badge" class="badge hidden">Private</span>
    </div>

    <div class="tabstrip">
      <div id="tabs" class="tabs"></div>
      <button id="new-tab" class="new-tab" title="New tab (Ctrl+T)" aria-label="New tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
      </button>
    </div>

    <div class="window-controls">
      <button id="min-btn" class="win-btn" title="Minimize" aria-label="Minimize">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12"/></svg>
      </button>
      <button id="max-btn" class="win-btn" title="Maximize" aria-label="Maximize">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
      </button>
      <button id="close-btn" class="win-btn close" title="Close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
  </header>

  <!-- ═══════════ TOOLBAR · nav + url + actions ═══════════ -->
  <div class="chrome-toolbar">
    <div class="nav-group">
      <button id="back" class="icon-btn" title="Back (Alt+←)" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button id="forward" class="icon-btn" title="Forward (Alt+→)" aria-label="Forward">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <button id="reload" class="icon-btn" title="Reload (Ctrl+R)" aria-label="Reload">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
        </svg>
      </button>
    </div>

    <div class="url-wrap">
      <span class="lock" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/>
          <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
        </svg>
      </span>
      <input id="url" type="text" placeholder="Search or enter URL"
             spellcheck="false" autocomplete="off" />
<button id="star" class="star-btn" title="Bookmark (Ctrl+D)" aria-label="Bookmark">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3l2.7 6.06 6.3.62-4.76 4.2 1.4 6.22L12 16.9 6.36 20.1l1.4-6.22L3 9.68l6.3-.62L12 3z"/>
  </svg>
</button>    </div>

    <div class="action-group">
      <button id="zoom-out" class="icon-btn" title="Zoom out (Ctrl+-)" aria-label="Zoom out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
      <button id="zoom-reset" class="zoom-badge" title="Reset zoom (Ctrl+0)">100%</button>
      <button id="zoom-in" class="icon-btn" title="Zoom in (Ctrl+=)" aria-label="Zoom in">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>

      <span class="divider"></span>

      <button id="downloads-btn" class="icon-btn" title="Downloads (Ctrl+J)" aria-label="Downloads">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>
        </svg>
      </button>
      <button id="history-btn" class="icon-btn" title="History (Ctrl+H)" aria-label="History">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"/><path d="M3 3v5h5"/><path d="M12 7.5V12l3 2"/>
        </svg>
      </button>
      <button id="devtools" class="icon-btn" title="DevTools (F12)" aria-label="Developer tools">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m4 17 6-6-6-6"/><path d="M12 19h8"/>
        </svg>
      </button>
      <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ═══════════ BOOKMARK BAR ═══════════ -->
  <div id="bookmark-bar" class="bookmark-bar"></div>

  <!-- ═══════════ SUGGESTIONS ═══════════ -->
  <div id="suggestions" class="suggestions hidden" style="z-index: 999;"></div>

  <!-- ═══════════ FIND BAR ═══════════ -->
  <div id="findbar" class="findbar hidden">
    <svg class="find-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
    </svg>
    <input id="find-input" type="text" placeholder="Find in page…" spellcheck="false" />
    <span id="find-count" class="find-count">0/0</span>
    <div class="find-actions">
      <button id="find-prev" class="icon-btn small" title="Previous" aria-label="Previous match">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>
      </button>
      <button id="find-next" class="icon-btn small" title="Next" aria-label="Next match">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <button id="find-close" class="icon-btn small" title="Close" aria-label="Close find bar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
  </div>

  <!-- ═══════════ DOWNLOAD TOAST ═══════════ -->
  <div id="dl-toast" class="dl-toast hidden">
    <span class="dl-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>
      </svg>
    </span>
    <span id="dl-toast-text">Download started…</span>
    <button id="dl-toast-open" class="toast-btn primary">Open</button>
    <button id="dl-toast-close" class="toast-btn ghost" aria-label="Dismiss">✕</button>
  </div>

  <!-- ═══════════ WEBVIEWS ═══════════ -->
  <!-- <div id="views" class="views"></div> -->

  <script src="renderer.js"></script>
</body>
</html>
